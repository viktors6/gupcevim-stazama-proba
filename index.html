<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1e4329">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gupčevim stazama">
<script>window.OTKLJUCANO=[0,6];</script>
<title>Gupčevim stazama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Nunito:wght@400;600;800;900&display=swap">
<style>
/* Layout: Marinina karta kao igraća ploča (postaje na njezinim kružićima, put od crkve do Oršića), sticky HUD gore;
   postaja se otvara u listu: lik → igrica → 3 pitanja → pečat. Namjerno jedna tema: svijet slikovnice, sve boje zadane izravno.
   IZVOR: ovu datoteku uređuj; gupcevim-stazama.html se slaže iz nje (ubacuju se podaci postaja i likovi.js). */
:root{
  --forest:#1e4329; --forest-2:#2d6640; --meadow:#93bd5c;
  --straw:#e9c04f; --straw-deep:#c99a22; --seal:#b2322a; --seal-deep:#8a2019;
  --paper:#f4f5e8; --paper-2:#e6e9cf; --wood:#6b4a2b;
  --ink:#1b281d; --muted:#56664f; --good:#2f7d3b; --bad:#b2322a;
  --font-display:"Grenze Gotisch","UnifrakturMaguntia",Georgia,"Times New Roman",serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--forest)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--forest)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--straw);outline-offset:3px}
svg{display:block}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--forest);color:var(--paper);border-bottom:3px solid #14301d;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hud-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud h1{font-family:var(--font-display);font-weight:700;font-size:1.65rem;line-height:1;margin:0;letter-spacing:.5px;color:var(--straw);margin-right:auto;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 10px 4px 6px;font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--paper)}
.chip svg{width:22px;height:22px;flex:none}
.chip.btn{padding:4px 8px}
.chip.btn:hover{background:rgba(255,255,255,.16)}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.25)}}

/* Karta */
.stage{max-width:1180px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mapwrap{border-radius:18px;overflow-x:auto;overflow-y:hidden;border:4px solid #13301c;box-shadow:0 10px 30px rgba(0,0,0,.35);background:var(--meadow);-webkit-overflow-scrolling:touch}
#map{width:100%;min-width:920px;height:auto}
.st{cursor:default}
.st.open,.st.done,.st.test{cursor:pointer}
.foot button.on{color:#fff;background:#b2322a;border-radius:6px;padding:1px 7px;text-decoration:none}
.st:focus{outline:none}
.st:focus-visible .ring-f{display:inline!important;stroke:#fff}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.95}100%{transform:scale(1.9);opacity:0}}
.trail{fill:none;stroke:none}
.drag{display:none;color:#cfe0c1;font-size:.82rem;text-align:center;margin:8px 0 0;font-weight:700}
@media (max-width:960px){.drag{display:block}}
.foot{color:#cfe0c1;font-size:.82rem;text-align:center;margin-top:14px}
.foot button{background:none;border:0;color:var(--straw);text-decoration:underline;padding:0}

/* List (sheet) */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(12,28,16,.62);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:100%;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
@media (min-width:680px){.overlay{align-items:center;padding:24px}.sheet{border-radius:22px;max-height:94vh;padding:24px 28px}}
@keyframes up{from{transform:translateY(40px)}}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:900;color:var(--muted);margin:0 0 4px}
.sheet h2{font-family:var(--font-display);font-weight:700;font-size:2.05rem;line-height:1.05;margin:0 0 4px;color:var(--forest);text-wrap:balance}
.motto{font-style:italic;color:var(--seal);font-weight:700;margin:0 0 12px}
.who{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.portrait{width:120px;height:120px}
.portrait svg{width:100%;height:100%}
.who h3{margin:0;font-size:1.3rem;font-weight:900;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--paper-2);color:var(--forest)}
.tag.trait{background:var(--seal);color:#fff}
.speech{position:relative;background:#fff;border:2px solid var(--forest);border-radius:16px;padding:14px 16px;margin:6px 0 12px;font-size:1.02rem}
.speech::before{content:"";position:absolute;top:-11px;left:48px;width:18px;height:18px;background:#fff;border-left:2px solid var(--forest);border-top:2px solid var(--forest);transform:rotate(45deg)}
.speech p{margin:0}
.speech.kaj p{font-style:italic}
.toggle{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:3px;gap:2px}
.toggle button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.82rem;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--forest);color:var(--paper)}
.ages{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:2px 0 14px}
.ages button{border:2px solid var(--paper-2);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:.9rem;color:var(--ink,#241a12);min-width:58px}
.ages button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.audio{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--muted);background:none;border-radius:12px;padding:6px 12px;color:var(--muted);font-size:.82rem;font-weight:700;cursor:not-allowed}
.audio svg{width:18px;height:18px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--seal);color:#fff;font-weight:900;font-size:1.05rem;padding:13px 22px;box-shadow:0 4px 0 var(--seal-deep);transition:transform .1s;touch-action:manipulation}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--seal-deep)}
.cta.alt{background:var(--forest);box-shadow:0 4px 0 #0f2516}
.cta.full{width:100%;margin-top:14px}
.ghost{background:none;border:0;color:var(--forest);font-weight:800;text-decoration:underline;padding:8px}
.gamebadge{display:flex;gap:12px;align-items:center;background:#fff6d6;border:2px dashed var(--straw-deep);border-radius:14px;padding:8px 12px;margin-top:12px}
.gamebadge .ic{width:52px;height:52px;flex:none}
.gamebadge b{display:block}
.gamebadge span{font-size:.88rem;color:var(--muted)}

/* Kviz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--paper-2);border:2px solid var(--forest)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.no{background:var(--bad);border-color:var(--bad)}
.dots i.now{background:var(--straw)}
.q{font-size:1.22rem;font-weight:900;line-height:1.3;margin:4px 0 14px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--forest);background:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:1rem;color:var(--ink);display:flex;gap:12px;align-items:center;transition:transform .08s,background .15s}
.opt:hover:not(:disabled){background:#fffbe6;transform:translateX(3px)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);font-size:.85rem}
.opt.ok{background:#e3f3df;border-color:var(--good)}
.opt.ok b{background:var(--good);color:#fff}
.opt.no{background:#fbe5e2;border-color:var(--bad)}
.opt.no b{background:var(--bad);color:#fff}
.opt.gone{opacity:.35;text-decoration:line-through}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.joker{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--straw-deep);background:#fff6d6;color:#6b4c00;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.82rem}
.joker:disabled{opacity:.45;cursor:not-allowed}
.joker svg{width:18px;height:18px}
.fact{margin-top:14px;border-radius:14px;padding:12px 14px;background:var(--paper-2);border-left:6px solid var(--forest);animation:up .3s ease}
.fact .verdict{font-weight:900;margin:0 0 4px}
.fact .verdict.ok{color:var(--good)}.fact .verdict.no{color:var(--bad)}
.fact p{margin:0}
.fact .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:var(--muted);display:block;margin-top:8px}

/* Igrice – zajedničko */
.gdesc{margin:0 0 12px;color:var(--muted);font-weight:600}
.ghud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.combo{color:var(--seal);font-weight:900}
.tbar{height:10px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin-bottom:10px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--seal),var(--straw));width:100%}
.hint{font-size:.82rem;color:var(--muted);text-align:center;margin:8px 0 0}
.gstart{display:grid;justify-items:center;gap:6px;text-align:center}
.gstart .big{width:120px;height:120px;animation:wob 2s ease-in-out infinite}
.gstart .big svg{width:100%;height:100%}
@keyframes wob{50%{transform:rotate(-6deg) scale(1.06)}}
.gres{text-align:center}
.stars{font-size:3.2rem;letter-spacing:6px;color:#d6d3c0;line-height:1;margin:6px 0}
.stars span{display:inline-block}
.stars .on{color:var(--straw-deep);text-shadow:0 3px 0 #8a6a10;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
.stars .on:nth-child(2){animation-delay:.15s}.stars .on:nth-child(3){animation-delay:.3s}
.gres .row{justify-content:center;margin-top:14px}
.gcv{display:block;width:100%;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.ic{display:inline-block;line-height:0}
.ic svg,.sp svg{width:100%;height:100%}
.aw>.ic{display:block;width:100%;height:100%}
.who2 svg{width:100%;height:100%}
.popf{position:absolute;font-weight:900;color:var(--forest);pointer-events:none;animation:floatup .8s forwards;white-space:nowrap;text-shadow:0 1px 0 #fff;font-size:1.1rem}
.popf.bad{color:var(--seal)}
@keyframes floatup{to{transform:translateY(-44px);opacity:0}}
.gwrap{position:relative}
.gmodal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,20,12,.6);border-radius:16px;padding:14px;z-index:3}
.gmodal .box{background:var(--paper);border-radius:16px;padding:14px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.gmodal .box .ic{width:70px;height:70px;margin:0 auto}
.gmodal .box p{margin:6px 0}
.gmodal .tf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.gmodal .tf .cta{padding:11px 8px;font-size:.98rem}

/* štala */
.legend2{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;background:#fff6d6;border-radius:12px;padding:6px 8px;margin-bottom:8px;transition:opacity .5s,max-height .5s;max-height:120px;overflow:hidden}
.legend2 span{display:inline-flex;align-items:center;gap:2px;font-weight:900}
.legend2 .ic{width:30px;height:30px}
.legend2.gone{opacity:0;max-height:0;padding:0;margin:0}
.barn{background:linear-gradient(#8a3b26,#6e2d1c);border-radius:16px;padding:10px 14px 12px;text-align:center;color:#fff;position:relative;overflow:hidden}
.pbar{height:8px;border-radius:9px;background:rgba(0,0,0,.3);overflow:hidden;margin-bottom:6px}
.pbar i{display:block;height:100%;width:100%;background:#9be27a}
.aw{width:130px;height:130px;margin:0 auto;position:relative}
.aw.pop{animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.aw.sick>.ic:first-child{filter:hue-rotate(60deg) saturate(.6) brightness(.95);animation:sway 1s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-5deg)}}
.aw .badge{position:absolute;right:-6px;top:-6px;width:56px;height:56px;animation:bump 1s infinite}
.say{font-weight:900;font-size:1.05rem;min-height:1.6em}
.foods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.food{border:2px solid var(--forest);background:#fff;border-radius:14px;padding:6px 0 4px;display:grid;justify-items:center;gap:0;touch-action:manipulation}
.food .ic{width:46px;height:46px}
.food small{font-size:.66rem;font-weight:800;color:var(--ink);line-height:1.2}
/* vile */
.holes{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:linear-gradient(#b9d6c8,#88b37a);padding:12px;border-radius:16px;position:relative}
.hole{aspect-ratio:1;border:0;border-radius:50%;position:relative;overflow:hidden;padding:0;touch-action:manipulation;background:radial-gradient(ellipse at 50% 85%,#6d9a55,#4f7d3d)}
.hole .mist{position:absolute;inset:auto -20% -8% -20%;height:55%;background:radial-gradient(ellipse at 30% 60%,rgba(255,255,255,.95),rgba(255,255,255,0) 60%),radial-gradient(ellipse at 70% 50%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%);z-index:2;animation:drift 4s ease-in-out infinite alternate;pointer-events:none}
.hole:nth-child(2n) .mist{animation-duration:5s;animation-delay:-2s}
@keyframes drift{to{transform:translateX(12%)}}
.hole .who2{position:absolute;inset:8% 10% 0;transform:translateY(110%);transition:transform .16s;z-index:1}
.hole.up .who2{transform:translateY(0)}
.hole .who2.gold{filter:drop-shadow(0 0 8px #ffd34d) saturate(1.4) brightness(1.08)}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff3a0;pointer-events:none;z-index:4;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* simon */
.simon{max-width:440px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{aspect-ratio:1.35;border:4px solid rgba(0,0,0,.18);border-radius:22px;filter:brightness(.78) saturate(.75);transition:filter .08s,transform .08s;touch-action:manipulation;display:grid;place-items:center;padding:6px}
.pad .ic{width:62%;height:auto;aspect-ratio:1}
.pad.lit{filter:brightness(1.3) saturate(1.25);transform:scale(1.05);box-shadow:0 0 0 6px rgba(255,255,255,.7)}
/* lupa */
.finds{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.finds .ic{width:44px;height:44px;border-radius:10px;background:#fff6d6;padding:3px;filter:grayscale(1) opacity(.45);transition:filter .3s}
.finds .ic.got{filter:none;box-shadow:0 0 0 3px var(--straw)}
.digrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.digrow .cta{flex:1;margin:0}
.heat{font-weight:900;min-width:90px;text-align:center}
/* X za izlaz iz igre */
.sheet{position:relative}
.gx{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:2.5px solid #241a12;background:#fffaf0;color:#241a12;font:900 24px/1 Nunito,sans-serif;display:grid;place-items:center;padding:0 0 2px;z-index:6;cursor:pointer;box-shadow:0 2px 0 #241a12}
.gx:active{transform:translateY(2px);box-shadow:none}
/* igra preko cijelog ekrana na mobitelu */
@media (max-width:679px),(max-height:500px){
  .overlay.play{padding:0;align-items:stretch}
  .overlay.play .sheet{height:100%;max-height:none;max-width:none;border-radius:0;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));padding-top:max(8px,env(safe-area-inset-top,0px));animation:none;overflow:auto}
  .overlay.play .sheet>h2,.overlay.play .gdesc,.overlay.play .gwrap .hint:not(#warn){display:none}
  .overlay.play .sheet>.eyebrow{margin:6px 52px 8px 4px}
  .overlay.play .gx{top:max(6px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px))}
}
/* 2. postaja: joystick i gumb za kopanje preko slike */
.joy{position:absolute;left:12px;bottom:12px;width:118px;height:118px;border-radius:50%;background:rgba(255,250,235,.38);border:3px solid rgba(36,26,18,.55);touch-action:none;z-index:2;box-shadow:inset 0 0 0 10px rgba(255,255,255,.12)}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fffaf0;border:3px solid #241a12;box-shadow:0 3px 0 #241a12;pointer-events:none}
.digbtn{position:absolute;right:14px;bottom:16px;width:96px;height:96px;border-radius:50%;border:3px solid #241a12;background:#e9c04f;color:#241a12;font:900 1.05rem/1.05 Nunito,sans-serif;display:grid;place-items:center;align-content:center;gap:2px;padding:0;z-index:2;box-shadow:0 5px 0 #241a12;touch-action:none;cursor:pointer}
.digbtn small{font-size:.78rem;font-weight:800}
.digbtn:active,.digbtn.on{transform:translateY(4px);box-shadow:0 1px 0 #241a12}
.digbtn:disabled{opacity:.5}
.heatb{position:absolute;right:14px;bottom:122px;width:96px;background:rgba(255,250,235,.9);border:2px solid rgba(36,26,18,.5);border-radius:12px;padding:3px 0;z-index:2;font-size:.9rem}
/* labirint */
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.dpad button{border:0;border-radius:12px;background:var(--forest);color:#fff;font-weight:900;font-size:1.4rem;box-shadow:0 3px 0 #0f2516;touch-action:manipulation}
.dpad .u{grid-column:2}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}

/* Pečat */
.sealbox{text-align:center;padding:8px 0}
.seal{width:150px;height:150px;margin:8px auto 14px;border-radius:50%;display:grid;place-items:center;position:relative;color:#fff;background:radial-gradient(circle at 35% 30%,#d9574d,var(--seal) 55%,var(--seal-deep));box-shadow:0 6px 0 rgba(0,0,0,.18),inset 0 0 0 7px rgba(255,255,255,.18)}
.seal.gold{background:radial-gradient(circle at 35% 30%,#fff1b0,var(--straw) 55%,var(--straw-deep));color:#5a3f00}
.seal svg{width:70px;height:70px}
.seal .ring{position:absolute;inset:10px;border:2px dashed currentColor;border-radius:50%;opacity:.55}
.stamp{animation:stamp .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.seal.stamp{animation-name:stampr}
@keyframes stampr{0%{transform:scale(2.4) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.earn{font-family:var(--font-display);font-size:2.2rem;color:var(--forest);margin:0}
.sub{color:var(--muted);margin:4px 0 0}

/* Uvod + kraj */
.hero{text-align:center}
.hero .big{font-family:var(--font-display);font-weight:700;font-size:3.1rem;line-height:.95;color:var(--forest);margin:4px 0 6px;text-wrap:balance}
.hero .lede{max-width:46ch;margin:0 auto 16px;color:var(--muted)}
.how{list-style:none;padding:0;margin:0 auto 18px;max-width:440px;display:grid;gap:10px;text-align:left}
.how li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;border:2px solid var(--paper-2)}
.how svg{width:34px;height:34px;color:var(--seal)}
.pick{margin:0 auto 6px;font-weight:800;font-size:.9rem}
.passport{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.mini{display:grid;justify-items:center;gap:3px;font-size:.7rem;font-weight:800;text-align:center;color:var(--muted);min-width:0}
.mini .seal{width:64px;height:64px;margin:0;box-shadow:0 3px 0 rgba(0,0,0,.15),inset 0 0 0 4px rgba(255,255,255,.18);transform:rotate(-8deg)}
.mini .seal svg{width:32px;height:32px}
.mini .st3{color:var(--straw-deep);letter-spacing:1px;font-size:.8rem}
.rank{font-family:var(--font-display);font-size:2.6rem;color:var(--seal);margin:0;line-height:1}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.stats .chip{background:var(--paper-2);color:var(--forest);border-color:transparent;padding:6px 12px}
blockquote{margin:16px auto 0;max-width:40ch;font-style:italic;color:var(--forest);font-weight:700}
blockquote cite{display:block;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* Putnik kroz vrijeme: lik, torba, zadatak, skok kroz vrijeme, vitrine */
.namebox{display:grid;gap:6px;max-width:440px;margin:0 auto 12px;text-align:left}
.namebox label{font-weight:800;font-size:.9rem}
.namebox input{font:inherit;font-weight:800;font-size:1.15rem;border:2px solid var(--forest);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}
.looks{display:flex;gap:12px;justify-content:center;margin:4px 0 12px}
.look{border:3px solid var(--paper-2);background:#fff;border-radius:16px;padding:6px 10px 4px;display:grid;justify-items:center;font-weight:800;font-size:.85rem;color:var(--muted)}
.look svg{width:84px;height:84px}
.look[aria-pressed="true"]{border-color:var(--seal);color:var(--seal);box-shadow:0 3px 0 var(--seal-deep)}
.ask{position:relative;background:#fff6d6;border:2px solid var(--straw-deep);border-radius:16px;padding:12px 14px 12px 64px;margin:0 0 12px;min-height:64px}
.ask .me{position:absolute;left:6px;bottom:4px;width:54px;height:54px}
.ask p{margin:0;font-weight:700}
.ask .k{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#8a6a10;margin-bottom:2px}
.need{display:flex;gap:10px;align-items:center;background:#eef5e6;border:2px solid var(--forest-2);border-radius:14px;padding:6px 12px;margin:0 0 12px;font-weight:800;font-size:.9rem}
.need .ic{width:40px;height:40px;flex:none}
.need.missing{background:#fbe5e2;border-color:var(--bad)}
.gotitem{display:grid;justify-items:center;gap:2px;background:#fff;border:2px dashed var(--straw-deep);border-radius:16px;padding:10px;margin:10px 0 4px;animation:up .4s ease}
.gotitem .ic{width:74px;height:74px}
.gotitem b{font-size:1.05rem}
.gotitem span{font-size:.85rem;color:var(--muted)}
.hint{margin:10px 0 0;font-weight:800;color:var(--forest)}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.slot{display:grid;justify-items:center;gap:3px;text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);min-width:0}
.slot .box{width:68px;height:68px;border-radius:16px;background:#fff;border:2px solid var(--paper-2);display:grid;place-items:center;color:var(--seal)}
.slot .box .ic,.slot .box svg{width:54px;height:54px}
.slot.empty .box{background:var(--paper-2);border-style:dashed;color:#b9bea6;font-size:1.6rem;font-weight:900}
.slot.empty{color:#b9bea6}
.bagdesc{background:#fff;border-radius:12px;padding:8px 12px;margin:0 0 6px;font-size:.88rem;text-align:left}
.bagdesc b{color:var(--forest)}
.tj{position:fixed;inset:0;z-index:65;display:grid;place-items:center;background:radial-gradient(circle,#2d6640,#0d2414);color:var(--straw);text-align:center;animation:tjin .3s ease}
@keyframes tjin{from{opacity:0}}
.tj .yr{font-family:var(--font-display);font-size:5.2rem;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(233,192,79,.6)}
.tj p{color:var(--paper);font-weight:800;margin:10px 0 0}
.tj .bk{width:90px;height:90px;margin:0 auto 6px;animation:spin 1.4s ease-in-out}
@keyframes spin{50%{transform:rotate(-12deg) scale(1.15)}}
.vitrine{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;background:linear-gradient(#6b4a2b,#4d321b);border-radius:16px;padding:10px}
.vitrine .slot .box{background:linear-gradient(#f6f9ff,#dfe8ef);border:3px solid #c9a86a;box-shadow:inset 0 0 12px rgba(255,255,255,.9)}
.vitrine .slot{color:#f4e8c8}
.hud .who3{display:inline-flex;align-items:center;gap:4px;font-weight:900}
.hud .who3 svg{width:28px;height:28px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:800;z-index:70;animation:up .3s ease}
@media (max-width:420px){.hud h1{font-size:1.35rem}.hero .big{font-size:2.5rem}.passport{gap:8px}.mini .seal{width:54px;height:54px}.who{grid-template-columns:96px 1fr}.portrait{width:96px;height:96px}.food .ic{width:38px;height:38px}.aw{width:110px;height:110px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

    g.classList.remove('locked','open','done','test'); g.classList.add(cls);

function walk(i, done){
  const p=document.getElementById('seg'+i), L=p.getTotalLength();
  focusSt(i, false);
  if(reduce){ placePawnAt(i+1); focusSt(i+1); return done(); }
  const T=Math.min(5200, 900+L*2.6), t0=performance.now(); let lastStep=0, lastX=P[i][0];
  const ease=x=> x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
  (function fr(now){
    const k=Math.min(1,(now-t0)/T), e=ease(k), q=p.getPointAtLength(e*L);
    const bob=Math.abs(Math.sin(k*Math.PI*16))*12, flip=q.x<lastX-0.2; lastX=q.x;
    setPawn(q.x+PAWN_OFF[0], q.y+PAWN_OFF[1], bob, flip);
    if(wrap.scrollWidth>wrap.clientWidth) wrap.scrollLeft = q.x/IW*svg.clientWidth - wrap.clientWidth/2;
    if(now-lastStep>190 && k<1){ sfx.step(); lastStep=now; }
    if(k<1) requestAnimationFrame(fr); else { focusSt(i+1,true); done(); }
  })(t0);
}

function timeJump(i, done){
  const from = i===0 ? new Date().getFullYear() : yearNum(PRICA[i-1].yr), to = yearNum(PRICA[i].yr);
  if(reduce || from===to){ return done(); }
  const ov=document.createElement('div'); ov.className='tj'; ov.setAttribute('role','status');
  ov.innerHTML=`<div><div class="bk">${sp('stranica')}</div><div class="yr" id="yr">${from}</div><p>Spomenica te nosi ${PRICA[i].yr==='danas'?'natrag u današnjicu':'u godinu '+PRICA[i].yr}</p></div>`;
  document.body.appendChild(ov); tone([[523,.08],[659,.08],[784,.08],[1047,.18]]);
  const t0=performance.now(), T=1500;
  (function fr(now){ const k=Math.min(1,(now-t0)/T), e=1-Math.pow(1-k,3);
    ov.querySelector('#yr').textContent = k<1 ? Math.round(from+(to-from)*e) : (PRICA[i].yr==='danas'?'Danas':to);
    if(k<1) requestAnimationFrame(fr); else setTimeout(()=>{ ov.remove(); done(); },650); })(t0);
}

function gStala(el,end){
  const AN=[['krava','Krava','gladna',0],['konj','Konj','gladan',1],['kokos','Kokoš','gladna',2],['svinja','Svinja','gladna',3]];

    <div class="legend2" id="lg">${AN.map(a=>`<span>${sp(a[0])}→${sp(FD[a[3]][0])}</span>`).join('')}<span>${sp('bolest')}→${sp('bilje')}</span></div>
    <div class="barn"><div class="pbar"><i id="pb"></i></div><div class="aw" id="an"></div><div class="say" id="say"></div></div>

  const an=el.querySelector('#an'), say=el.querySelector('#say'), sc=el.querySelector('#sc'), cb=el.querySelector('#cb'), pb=el.querySelector('#pb');
  const T=30000, t0=performance.now(); let cur=null, score=0, streak=0, over=false, n=0;
  function next(){
    let k; do{ k=Math.floor(Math.random()*4); }while(cur && k===cur.k && Math.random()<.7);
    const sick = n>=3 && Math.random()<A(0,.05,.12,.28,.4); n++;
    const el2=(performance.now()-t0)/T;
    cur={k, sick, born:performance.now(), life:(3400-1900*el2)*A(3.8,3.0,1.7,1,.7)};
    an.className='aw'+(sick?' sick':''); an.innerHTML=sp(AN[k][0])+(sick?`<span class="badge">${LG.bolest()}</span>`:'');
    void an.offsetWidth; an.classList.add('pop');
    say.textContent = sick ? `${AN[k][1]} je bolesn${AN[k][2].endsWith('n')?'':'a'}! Izliječi je.` : `${AN[k][1]} je ${AN[k][2]}!`;
  }
  function answer(k){
    if(over||!cur) return; const need = cur.sick ? 4 : AN[cur.k][3];
    if(k===need){ streak++; const pts=streak>=5?2:1; score+=pts; sfx.pop(); popText(el.querySelector('.barn'), `+${pts}`, 20+Math.random()*60, 30); cb.textContent = streak>=5 ? `Niz ×2! (${streak})` : (streak>=2?`Niz ${streak}`:''); next(); }
    else { streak=0; cb.textContent=''; score=Math.max(0,score-A(0,0,0,1,1)); sfx.bad(); say.textContent = k===4 ? 'Nije bolesna, gladna je!' : 'Fuj, to ne jedem!'; an.classList.remove('pop'); an.classList.add('shake'); later(()=>an.classList.remove('shake'),400); }
    sc.textContent=score;
  }
  el.querySelectorAll('.food').forEach(b=>b.addEventListener('pointerdown',e=>{ e.preventDefault(); answer(+b.dataset.k); }));
  if(LVL()>1) later(()=>{ el.querySelector('#lg').classList.add('gone'); toast('Sad napamet!'); }, A(0,0,12000,5000,2500));   /* najmlađima pomoć ostaje */
  loop(now=>{ if(over) return false; if(cur){ const left=1-(now-cur.born)/cur.life; pb.style.width=Math.max(0,left*100)+'%'; pb.style.background= left<.3?'#e4572e':'#9be27a';
      if(left<=0){ streak=0; cb.textContent=''; score=Math.max(0,score-1); sc.textContent=score; sfx.bad(); toast(`${AN[cur.k][1]} je otišla gladna!`.replace('Konj je otišla','Konj je otišao')); next(); } } });
  next();
  timer(el.querySelector('.tbar i'),T/1000,()=>{ over=true; end(score>=A(6,8,15,26,30)?3:score>=A(3,4,8,14,17)?2:1, `Osvojio si ${score} bodova u grofičinoj štali.`); });
}

  });
}

/* ===== 3 · Jelin bijeg kroz Piškornicu (labirint) ===== */
const TVRDNJE=[['Tuča je 1746. uništila urod u stubičkom kraju.',1],['Coprnice iz Piškornice zaista su prizvale tuču.',0],['Jela Futakovica bila je kmetica iz Lepe Vesi.',1],['Pjena s mlinskog kotača ispire kletve coprnica.',0],['Krivci za Jelinu smrt kažnjeni su nakon istrage.',1],['Jela je bila posljednja spaljena vještica u Europi.',0],['Raspela su se postavljala na raskrižja.',1],['Jela je mogla prokleti Franju Tahyja.',0]];

  let pos=0, px=0, py=0, herbsN=0, gatesN=0, wrong=0, scared=0, over=false, moving=false, asking=false, last=0, check=0, inv=0, lastT=performance.now(), t0=performance.now();

    ctx.fillStyle=`rgba(255,220,120,${.4+.3*Math.sin(now/250)})`; ctx.beginPath(); ctx.arc(cx(EXIT),cy(EXIT),cell*.16,0,7); ctx.fill();

  });

/* ===== 4 · Puntarski znak (svaki krug duži i brži) ===== */
function gZnak(el,end){
  const PD=[['list','#4f9a45',330],['casa','#b2322a',392],['zito','#d9a92f',494],['zvono','#3f74a8',587]];
  const GOAL=A(3,4,5,8,12), START=A(2,2,3,3,4);

    <div class="simon">${PD.map((p,k)=>`<button class="pad" type="button" data-k="${k}" style="background:${p[1]}" aria-label="Znak ${k+1}">${sp(p[0])}</button>`).join('')}</div><p class="hint">Cilj: zapamtiti znak od ${GOAL} koraka.</p>`;
  const pads=[...el.querySelectorAll('.pad')], msg=el.querySelector('#msg'); const seq=[]; let pos=0, input=false, best=0;
  const add=()=>seq.push(Math.floor(Math.random()*4));

    const f=Math.max(.4,Math.pow(A(.96,.93,.9,.86,.79),seq.length-3))*A(1.8,1.6,1.2,1,1); el.querySelector('#bz').textContent=(1/f).toFixed(1).replace('.',',')+'×';
    const on=380*f, gap=560*f; seq.forEach((k,j)=>later(()=>flash(k,on),500+j*gap)); later(()=>{ input=true; pos=0; msg.textContent='Tvoj red!'; },500+seq.length*gap); }
  pads.forEach(p=>p.addEventListener('pointerdown',e=>{
    e.preventDefault(); if(!input) return; const k=+p.dataset.k; flash(k,200);
    if(k!==seq[pos]){ input=false; msg.textContent='Krivi znak!'; later(sfx.bad,120); p.classList.add('shake');
      return later(()=>end(best>=GOAL?3:best>=GOAL-2?2:1, best?`Zapamtio si puntarski znak od ${best} koraka.`:'Puntarski znak je bio prekratak. Probaj opet!'),1000); }

const GFX={};
function gfxReady(){
  if(GFX.ok) return true;
  if(!GFX.im){ GFX.im=new Image(); GFX.im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(CRKVA_SVG); }
  if(!(GFX.im.complete && GFX.im.naturalWidth)) return false;
  /* crkva rasterizirana jednom u visokoj razlučivosti */
  const c=document.createElement('canvas'); c.width=480; c.height=792; c.getContext('2d').drawImage(GFX.im,0,0,480,792); GFX.crkva=c;
  /* kaldrma: pločica koja se ponavlja (1024 × 128), kamenje u redovima s pomakom */
  const t=document.createElement('canvas'); t.width=1024; t.height=128; const x=t.getContext('2d');
  x.fillStyle='#a58c66'; x.fillRect(0,0,1024,128);
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const cols=['#d4bd92','#c8ad7f','#dcc8a2','#bfa375','#cfb68b','#d9c49c'];
  for(let r=0;r<8;r++){ let px=(r%2)*11; const y=r*16;
    while(px<1024+24){ const w=18+rnd()*10, c=cols[Math.floor(rnd()*cols.length)];
      for(const ox of [0,-1024]){ const X=px+ox; if(X>1024||X+w<0) continue;
        x.fillStyle=c; rrect(x,X+1.2,y+1.4,w-2.4,13.2,5); x.fill();
        x.fillStyle='rgba(255,250,235,.2)'; rrect(x,X+3,y+2.4,w-7,4,2); x.fill();
        x.fillStyle='rgba(70,45,20,.12)'; rrect(x,X+2,y+10.5,w-4,3.5,2); x.fill(); }
      px+=w; } }
  GFX.tile=t; GFX.mip=[t];
  for(let k=1;k<7;k++){ const prev=GFX.mip[k-1], m=document.createElement('canvas'); m.width=Math.max(1,prev.width>>1); m.height=Math.max(1,prev.height>>1); const mx=m.getContext('2d'); mx.imageSmoothingEnabled=true; mx.imageSmoothingQuality='high'; mx.drawImage(prev,0,0,m.width,m.height); GFX.mip.push(m); }
  GFX.ok=true; return true;
}

/* Postaja: kviz */
function quiz(i, qi, run){
  const s=S[i], q=s.qs[qi], L=['A','B','C'];
  const ord=shuffle([0,1,2]);
  const box = sheet(`
    <div class="qhead"><p class="eyebrow" style="margin:0">${s.name} pita · pitanje ${qi+1}/3</p>
      <div class="dots">${[0,1,2].map(k=>`<i class="${run.marks[k]||(k===qi?'now':'')}"></i>`).join('')}</div></div>
    <p class="q">${q.q}</p>
    <div class="opts">${ord.map((o,k)=>`<button class="opt" type="button" data-k="${o}"><b>${L[k]}</b><span>${q.o[o]}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="joker" type="button" id="joker" ${st.jokers<1?'disabled':''}>${ico('tambura',3)}Petričin savjet (${st.jokers})</button><span class="eyebrow" style="margin:0">točno = 100 ft</span></div>
    <div id="after"></div>
  `);
  let used=false, answered=false;
  const opts=[...box.querySelectorAll('.opt')];
  box.querySelector('#joker').onclick=(e)=>{
    if(used||answered||st.jokers<1) return;
    used=true; st.jokers--; save(); hud(); sfx.joker();
    const wrong=opts.filter(b=>+b.dataset.k!==q.a), kill=wrong[Math.floor(Math.random()*wrong.length)];
    kill.classList.add('gone'); kill.disabled=true; e.currentTarget.disabled=true;
    toast('Petrica šapće: „Ovo sigurno nije!”');
  };
  opts.forEach(b=>b.onclick=()=>{
    if(answered) return; answered=true;
    const k=+b.dataset.k, ok=k===q.a, pts= ok ? (used?50:100) : 0;
    opts.forEach(x=>x.disabled=true); box.querySelector('#joker').disabled=true;
    opts.find(x=>+x.dataset.k===q.a).classList.add('ok');
    if(!ok){ b.classList.add('no','shake'); sfx.no(); } else sfx.ok();
    run.marks[qi]= ok?'ok':'no'; if(ok){ run.ok++; run.pts+=pts; st.score+=pts; save(); hud(true); }
    box.querySelectorAll('.dots i')[qi].className = ok?'ok':'no';
    const last = qi===2;
    box.querySelector('#after').innerHTML = `<div class="fact">
      <p class="verdict ${ok?'ok':'no'}">${ok ? (used?'Točno! +50 forinti (uz Petričinu pomoć)':'Točno! +100 forinti') : 'Ne baš… točan je odgovor označen zeleno.'}</p>
      <span class="k">Jeste li znali?</span><p>${q.f}</p></div>
      <button class="cta ${last?'':'alt'} full" type="button" id="cont">${last?'Uzmi pečat!':'Sljedeće pitanje'}</button>`;
    const c=box.querySelector('#cont'); c.focus({preventScroll:true}); c.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
    c.onclick=()=> last ? sealStep(i,run) : quiz(i,qi+1,run);
  });
}

/* Postaja: pečat */
function sealStep(i, run){
  const s=S[i], gold=run.ok===3;
  let bonus=0; if(gold){ bonus=100; st.score+=bonus; }
  st.res[i]={ok:run.ok, stars:run.stars}; save();
  const box = sheet(`<div class="sealbox">
    <p class="eyebrow">Postaja ${i+1} · ${s.place}</p>
    <div class="seal stamp ${gold?'gold':''}"><span class="ring"></span>${ico(s.sym,3.2)}</div>
    <p class="earn">${gold?'Zlatni pečat!':'Pečat je tvoj!'}</p>
    <p class="sub">Igrica: ${'★'.repeat(run.stars)}${'☆'.repeat(3-run.stars)} (${run.gpts} ft) · Pitanja: ${run.ok}/3 (${run.pts} ft)${gold?' · bonus +100 ft':''}</p>
    <div class="gotitem">${itemIc(PRICA[i].gets)}<b>U torbu: ${ITEMS[PRICA[i].gets].n}</b><span>${PRICA[i].thanks(st.name)}</span></div>
    ${i<7 ? `<p class="hint">Sljedeća stranica Spomenice: ${PRICA[i+1].yr==='danas'?'natrag u današnjicu':'godina '+PRICA[i+1].yr} · ${S[i+1].place}</p>` : ''}
    <button class="cta full" type="button" id="go">${i<7?'Okreni stranicu i kreni dalje':'Otvori vitrine u muzeju'}</button>
  </div>`);
  sfx.seal(); hud(true);
  box.querySelector('#go').onclick=()=>{
    closeSheet(); st.stage=i+1; save(); paintMap();
    if(i<7){ placePawnAt(i); walk(i, ()=>{ placePawnAt(i+1); setTimeout(()=>openStation(i+1),350); }); }
    else setTimeout(finale, 300);
  };
}

/* Kraj: putovnica */
function rankOf(score){
  if(score>=4200) return ['Seljački kralj','Savršeno! Gubec bi ti ponudio mjesto za kamenim stolom.'];
  if(score>=3000) return ['Seljački kapetan','Pasanec i Magaić rado bi te imali u svojem odredu.'];
  if(score>=1800) return ['Puntar','Pod Gupčevom lipom za tebe uvijek ima mjesta.'];
  return ['Kmet s motikom','Svaki puntar počeo je od prve brazde. Probaj opet!'];
}
function finale(){
  const ok=st.res.reduce((a,r)=>a+(r?r.ok:0),0), stars=st.res.reduce((a,r)=>a+(r?r.stars||0:0),0); const [title,line]=rankOf(st.score);
  sheet(`<div class="hero">
    <p class="eyebrow">Muzej seljačkih buna · dvorac Oršić · danas</p>
    <p class="big" style="font-size:2.3rem">Dobro ${G('došao','došla')} kući, ${st.name||'putniče'}!</p>
    <p class="lede">Grofica je otključala vitrine. Sve što si ${G('skupio','skupila')} putujući kroz stoljeća, od Ciglerove Spomenice do Jelinih trava, sad je izloženo u muzeju.</p>
    ${bagHTML('vitrine')}
    <p class="eyebrow" style="margin-top:14px">Tvoja puntarska putovnica</p>
    <p class="rank">${title}</p>
    <p class="lede" style="margin-top:8px">${line}</p>
    <div class="passport">${S.map((s,i)=>{ const r=st.res[i]; return `<div class="mini"><div class="seal ${r&&r.ok===3?'gold':''}">${ico(s.sym,3.4)}</div><span class="st3">${'★'.repeat(r?r.stars||0:0)}</span><span>${s.short}</span></div>`; }).join('')}</div>
    <div class="stats"><span class="chip">${ico('coin',3)}${st.score.toLocaleString('hr-HR')} forinti</span><span class="chip">★ ${stars}/24 zvjezdica</span><span class="chip">${ico('seal',3)}${ok}/24 točno</span></div>
    <p class="lede">Tahy je za pola vlastelinstva platio 44.000 forinti. Ti si svoje zaradio znanjem i spretnošću, i njih ti nitko ne može oduzeti.</p>
    <blockquote>„I mali je čovjek čovjek, ne prah.”<cite>Petričina balada za današnje doba</cite></blockquote>
    <button class="cta full" type="button" id="again">Igraj ponovno</button>
    <div><button class="ghost" type="button" id="mapb">Pogledaj kartu</button></div>
  </div>`, closeSheet);
  layer.querySelector('#again').onclick=()=>{ st=Object.assign(fresh(),{name:st.name,look:st.look,lang:st.lang,age:st.age}); save(); closeSheet(); hud(); paintMap(); window.scrollTo({top:0}); intro(); };
  layer.querySelector('#mapb').onclick=closeSheet;
  confetti();
}
function confirmReset(){
  const box=sheet(`<div class="hero"><p class="big" style="font-size:2.2rem">Kreni ispočetka?</p><p class="lede">Izgubit ćeš skupljene forinte, zvjezdice i pečate.</p>
    <button class="cta full" type="button" id="yes">Da, kreni ispočetka</button>
    <button class="cta alt full" type="button" id="all">Obriši i profil (novi igrač)</button>
    <p class="sub" style="margin:4px 0 0">Profil su ime i lik. Nakon brisanja igra počinje kao da je prvi put otvorena.</p>
    <div><button class="ghost" type="button" id="no">Odustani</button></div></div>`, closeSheet);
  box.querySelector('#no').onclick=closeSheet;
  box.querySelector('#all').onclick=()=>{ st=Object.assign(fresh(),{lang:st.lang,sound:st.sound}); save(); closeSheet(); hud(); paintMap(); window.scrollTo({top:0}); intro(); toast('Profil je obrisan.'); };
  box.querySelector('#yes').onclick=()=>{ st=Object.assign(fresh(),{name:st.name,look:st.look,lang:st.lang,age:st.age}); save(); closeSheet(); hud(); paintMap(); window.scrollTo({top:0}); intro(); };
}

/* Konfeti */
function confetti(){
  if(reduce) return;
  const c=document.getElementById('confetti'), x=c.getContext('2d'); c.hidden=false;
  const W=c.width=innerWidth, H=c.height=innerHeight, cols=['#e9c04f','#b2322a','#2d6640','#f4f5e8'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:4+Math.random()*5,a:Math.random()*6,c:cols[Math.floor(Math.random()*4)]}));
  const t0=performance.now();
  (function fr(now){ x.clearRect(0,0,W,H); ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(now-t0<4000) requestAnimationFrame(fr); else { x.clearRect(0,0,W,H); c.hidden=true; } })(t0);
}

/* ---------- Start ---------- */
buildMap(); hud(); paintMap();
/* jednokratno pitanje o dobi za stare profile */
function askAge(){
  const box=sheet(`<div class="hero"><p class="big" style="font-size:2.1rem">Koliko ti je godina?</p><p class="lede">Prema dobi prilagodit ćemo težinu igrica. Možeš je kasnije promijeniti u torbi.</p>
    <div class="ages" id="ageT">${AGES.map((a,k)=>`<button type="button" data-a="${k}">${a}</button>`).join('')}</div></div>`);
  box.querySelectorAll('#ageT button').forEach(b=>b.onclick=()=>{ st.age=+b.dataset.a; NEED_AGE=false; save(); closeSheet(); hud(); toast('Igrice su prilagođene dobi '+AGES[st.age]+'.'); });
}
if(!st.started || !st.name) intro();
else if(NEED_AGE) askAge();
else if(st.stage>=8) setTimeout(finale,200);
else setTimeout(()=>focusSt(st.stage),150);
})();
</script>
